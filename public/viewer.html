<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제출 파일 보기</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/viewer.css">
  <script src="/vendor/jszip.min.js" defer></script>
  <script src="/vendor/docx-preview.min.js" defer></script>
</head>
<body>
  <header class="v-head">
    <span class="v-student" id="vStudent">🖥️ 보조 모니터</span>
    <strong class="v-name" id="vName"></strong>
    <div class="spacer"></div>
    <a class="btn sm hidden" id="vDownload">⬇️ 다운로드</a>
    <button class="btn sm" id="vFull">⛶ 전체화면</button>
  </header>
  <main class="v-body">
    <div id="vBox" class="preview">
      <div class="pv-empty">
        <div class="pv-empty-icon">🖥️</div>
        <p class="muted">교사 대시보드에서 학생이 제출한 파일을 누르면 여기에 크게 표시됩니다.</p>
      </div>
    </div>
  </main>
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
